<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <script src="../js/data.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Let's run sort/ranking on UDON_COMPANIES exactly as app.js does
      // Let's see what app.js does to rank companies
      const results = [];
      const list = (typeof getFilteredAndSortedCompanies === 'function') 
        ? getFilteredAndSortedCompanies() 
        : (typeof currentFilteredCompanies !== 'undefined' ? currentFilteredCompanies : UDON_COMPANIES);
      
      list.forEach((c, idx) => {
        results.push({
          rank: idx + 1,
          id: c.id,
          name: c.name,
          hasName: !!c.name && c.name.trim().length > 0,
          rawName: c.name
        });
      });

      const pre = document.createElement('pre');
      pre.id = 'render-check';
      pre.textContent = JSON.stringify(results.slice(0, 25), null, 2);
      document.body.appendChild(pre);
    });
  </script>
</body>
</html>
