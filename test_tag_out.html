<!DOCTYPE html>
<html><head>
  <meta charset="utf-8">
  <title>Inspect A House</title>
</head>
<body class="auth-locked">
  <div id="results">ERROR: isExplicitOtherProvince is not defined</div>
  <script src="../js/data.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/app.js"></script>
  <script>
    async function test() {
      try {
        const response = await fetch('dataset.json');
        const rawJson = await response.json();
        const postList = Array.isArray(rawJson) ? rawJson : (rawJson.items || rawJson.data || [rawJson]);
        
        const ahousePosts = postList.filter(p => {
          const url = (p.facebookUrl || p.inputUrl || p.url || '').toLowerCase();
          const pName = (p.pageName || (p.user && p.user.name) || '').toLowerCase();
          const txt = (p.text || p.message || '').toLowerCase();
          return url.includes('ahouse') || pName.includes('a house') || pName.includes('เอเฮ้าส์') || txt.includes('เอเฮ้าส์');
        });

        const logs = [];
        logs.push('Found ' + ahousePosts.length + ' raw posts for A House');

        ahousePosts.forEach((p, idx) => {
          logs.push('----------------------------------------');
          logs.push('POST #' + (idx + 1) + ' | Date: ' + p.time + ' | URL: ' + p.url);
          logs.push('Text: ' + p.text);
          
          const isOther = isExplicitOtherProvince(p);
          const isHoliday = isHolidayAnnouncement(p);
          const isAd = isAdWithoutDistrictOrPerson(p);
          const is3D = isPure3DOrGraphicRender(p);
          const isDesign = isDesignWithoutDistrictOrPerson(p);
          const isRecruit = isRecruitmentPost(p);
          const isPR = isCompanyPROrEmptyPost(p);
          const isDone = isCompletedOrHandoverPost(p);
          const isCorpPromo = isCorporatePRAndServicePromo(p);
          
          logs.push('>> isOther:' + isOther + ' | isHoliday:' + isHoliday + ' | isAd:' + isAd + ' | is3D:' + is3D + ' | isDesign:' + isDesign + ' | isRecruit:' + isRecruit + ' | isPR:' + isPR + ' | isDone:' + isDone + ' | isCorpPromo:' + isCorpPromo);
        });

        const pre = document.createElement('pre');
        pre.id = 'log-output';
        pre.textContent = logs.join('\n');
        document.body.appendChild(pre);
      } catch (err) {
        document.getElementById('results').textContent = 'ERROR: ' + err.message;
      }
    }
    window.addEventListener('DOMContentLoaded', test);
  </script>


</body></html>
