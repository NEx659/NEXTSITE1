<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Mosaic Modal</title>
</head>
<body>
  <div id="company-detail-modal" style="display:none;"></div>
  <div id="modal-projects-container"></div>
  <div id="modal-score-card"></div>
  <div id="test-output"></div>

  <script src="../js/data.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/app.js"></script>

  <script>
    loadSavedCompaniesData();
    const c = allCompanies.find(x => x.id === 'comp-udon-58');
    renderCompanyProjectsList(c);
    
    const container = document.getElementById('modal-projects-container');
    const out = document.getElementById('test-output');
    out.innerText = JSON.stringify({
      company: c.name,
      projectsCount: c.projects.length,
      firstProjectName: c.projects[0] ? c.projects[0].name : 'NONE',
      firstProjectLink: c.projects[0] ? c.projects[0].facebookPostUrl : 'NONE',
      renderedHtmlLength: container ? container.innerHTML.length : 0
    }, null, 2);
  </script>
</body>
</html>
