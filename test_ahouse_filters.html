<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inspect Twentysix extraction</title>
</head>
<body>
  <script src="../js/data.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/app.js"></script>
  <script>
    async function test() {
      try {
        const resp = await fetch('dataset.json');
        const rawJson = await resp.json();
        
        processApifyJsonData(rawJson, 'test-twentysix');
        
        const comp = allCompanies.find(c => c.id === 'comp-udon-08' || (c.name && c.name.includes('ทเวนตี้ซิกซ์')));
        
        const pre = document.createElement('pre');
        pre.id = 'result-json';
        pre.textContent = JSON.stringify({
          id: comp.id,
          name: comp.name,
          totalProjects: comp.totalProjects,
          opportunityScore: comp.opportunityScore,
          stageBreakdown: comp.stageBreakdown,
          projects: comp.projects.map(p => ({
            id: p.projectId,
            name: p.name,
            location: p.location,
            stage: p.stage,
            stageKey: p.stageKey,
            postedTime: p.postedTime,
            postUrl: p.postUrl
          }))
        }, null, 2);
        document.body.appendChild(pre);
      } catch (err) {
        const pre = document.createElement('pre');
        pre.id = 'result-json';
        pre.textContent = 'ERROR: ' + err.message;
        document.body.appendChild(pre);
      }
    }
    window.addEventListener('DOMContentLoaded', test);
  </script>
</body>
</html>
