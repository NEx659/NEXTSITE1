<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <pre id="out"></pre>
  <script>
    async function run() {
      const resp = await fetch('dataset.json');
      const items = await resp.json();
      
      const ehousePosts = items.filter(p => {
        const pn = (p.pageName || (p.user && p.user.name) || '').toLowerCase();
        const url = (p.url || '').toLowerCase();
        return pn.includes('esarnthaihouse') || url.includes('esarnthaihouse') || (p.text && (p.text.includes('094-8289263') || p.text.includes('e house') || p.text.includes('ehouseconstruction')));
      });

      const res = ehousePosts.map((p, idx) => ({
        index: idx + 1,
        time: p.time,
        url: p.url,
        pageName: p.pageName || (p.user && p.user.name),
        text: p.text
      }));
      document.getElementById('out').textContent = JSON.stringify(res, null, 2);
    }
    window.addEventListener('DOMContentLoaded', run);
  </script>
</body>
</html>
