<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <pre id="out"></pre>
  <script>
    async function run() {
      const resp = await fetch('dataset.json');
      const items = await resp.json();
      
      // Look for any posts from E House, esarnthaihouse, ModernDe, etc.
      const ehousePosts = items.filter(p => {
        const pn = (p.pageName || (p.user && p.user.name) || '').toLowerCase();
        const url = (p.url || '').toLowerCase();
        const txt = (p.text || '').toLowerCase();
        return pn.includes('ehouse') || pn.includes('อีเฮาส์') || pn.includes('esarnthai') || pn.includes('modernde') || url.includes('esarnthaihouse') || url.includes('moderndehousebuilder') || txt.includes('e house') || txt.includes('อีเฮาส์');
      });

      const res = ehousePosts.map((p, idx) => ({
        index: idx + 1,
        time: p.time,
        url: p.url,
        pageName: p.pageName || (p.user && p.user.name),
        text: p.text
      }));
      document.getElementById('out').textContent = JSON.stringify(res, null, 2);
    }
    window.addEventListener('DOMContentLoaded', run);
  </script>
</body>
</html>
