<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inspect A House from whole dataset</title>
</head>
<body>
  <script src="../js/data.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/app.js"></script>
  <script>
    async function test() {
      try {
        const resp = await fetch('dataset.json');
        const rawJson = await resp.json();
        
        processApifyJsonData(rawJson, 'test-full');
        
        const comp = allCompanies.find(c => c.id === 'comp-udon-40' || (c.name && c.name.includes('เอ เฮ้าส์')));
        
        const pre = document.createElement('pre');
        pre.id = 'result-json';
        pre.textContent = JSON.stringify({
          id: comp.id,
          name: comp.name,
          totalProjects: comp.totalProjects,
          opportunityScore: comp.opportunityScore,
          stageBreakdown: comp.stageBreakdown,
          projects: comp.projects
        }, null, 2);
        document.body.appendChild(pre);
      } catch (err) {
        const pre = document.createElement('pre');
        pre.id = 'result-json';
        pre.textContent = 'ERROR: ' + err.message;
        document.body.appendChild(pre);
      }
    }
    window.addEventListener('DOMContentLoaded', test);
  </script>
</body>
</html>
