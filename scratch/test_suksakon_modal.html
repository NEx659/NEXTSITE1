<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Modal Suksakon</title>
</head>
<body>
  <div id="company-detail-modal" class="modal-backdrop">
    <div id="modal-score-card"></div>
    <div id="modal-project-list"></div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      openCompanyProjectsModal('comp-udon-09');
      setTimeout(() => {
        const scoreCard = document.getElementById('modal-score-card');
        const pre = document.createElement('pre');
        pre.id = 'modal-html';
        pre.textContent = scoreCard ? scoreCard.innerHTML : 'NOT FOUND';
        document.body.appendChild(pre);
      }, 500);
    });
  </script>
</body>
</html>
