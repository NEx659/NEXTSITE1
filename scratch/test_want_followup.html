<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Want Followup</title>
</head>
<body>
  <div id="test-output"></div>

  <!-- User status header elements -->
  <span id="user-cnt-want-followup">0</span>
  <span id="user-cnt-following">0</span>
  <div id="user-filter-want-btn"></div>
  <div id="user-filter-following-btn"></div>
  <tbody id="company-table-body"></tbody>

  <script src="../js/data.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/app.js"></script>

  <script>
    (async function runTest() {
      const out = document.getElementById('test-output');
      const results = [];

      try {
        // Init state
        loadSavedCompaniesData();
        updateUserCrmStatusSummary();
        renderTable();

        const initialWant = document.getElementById('user-cnt-want-followup').textContent;
        results.push("Initial Want Count: " + initialWant);

        // Click target on comp-udon-04
        toggleTargetFollowup('comp-udon-04');
        const wantAfterClick1 = document.getElementById('user-cnt-want-followup').textContent;
        results.push("Want Count After comp-udon-04 toggle: " + wantAfterClick1);

        // Click target on comp-udon-05
        toggleTargetFollowup('comp-udon-05');
        const wantAfterClick2 = document.getElementById('user-cnt-want-followup').textContent;
        results.push("Want Count After comp-udon-05 toggle: " + wantAfterClick2);

        // Check if comp-udon-04 is targeted
        const isComp4Targeted = isCompanyTargetedByUser('comp-udon-04');
        results.push("isCompanyTargetedByUser(comp-udon-04): " + isComp4Targeted);

        // Toggle off comp-udon-04
        toggleTargetFollowup('comp-udon-04');
        const wantAfterUntarget = document.getElementById('user-cnt-want-followup').textContent;
        results.push("Want Count After comp-udon-04 untoggle: " + wantAfterUntarget);

        out.innerText = results.join('\n');
      } catch (e) {
        out.innerText = "ERROR: " + e.message + "\n" + e.stack;
      }
    })();
  </script>
</body>
</html>
